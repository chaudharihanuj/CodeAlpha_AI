<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Language Translator</title>
##CSS
    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            margin: 0;
            background: #f4f7fb;
        }

        .container {
            width: 90%;
            max-width: 900px;
            margin: 50px auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 10px;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
        }

        .language-box {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }

        .language {
            flex: 1;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        select, textarea {
            width: 100%;
            padding: 12px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 16px;
        }

        textarea {
            height: 150px;
            resize: vertical;
        }

        .buttons {
            margin-top: 20px;
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        button {
            padding: 12px 20px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
        }

        .translate-btn {
            background: #2563eb;
            color: white;
        }

        .copy-btn {
            background: #16a34a;
            color: white;
        }

        .speak-btn {
            background: #9333ea;
            color: white;
        }

        button:hover {
            opacity: 0.85;
        }

        .result {
            margin-top: 25px;
        }

        #status {
            margin-top: 10px;
            color: #555;
        }

        @media(max-width: 600px) {
            .language-box {
                flex-direction: column;
            }
        }
    </style>
</head>

<body>

<div class="container">

    <h1>🌐 Language Translation Tool</h1>

    <p class="subtitle">
        Translate text between different languages using a Translation API
    </p>

    <div class="language-box">

        <div class="language">
            <label>Source Language</label>

            <select id="source">
                <option value="en">English</option>
                <option value="hi">Hindi</option>
                <option value="gu">Gujarati</option>
                <option value="fr">French</option>
                <option value="de">German</option>
                <option value="es">Spanish</option>
                <option value="ja">Japanese</option>
                <option value="ko">Korean</option>
            </select>
        </div>

        <div class="language">
            <label>Target Language</label>

            <select id="target">
                <option value="hi">Hindi</option>
                <option value="en">English</option>
                <option value="gu">Gujarati</option>
                <option value="fr">French</option>
                <option value="de">German</option>
                <option value="es">Spanish</option>
                <option value="ja">Japanese</option>
                <option value="ko">Korean</option>
            </select>
        </div>

    </div>

    <label>Enter Text</label>

    <textarea id="inputText"
        placeholder="Enter the text you want to translate..."></textarea>

    <div class="buttons">

        <button class="translate-btn" onclick="translateText()">
            🔄 Translate
        </button>

        <button class="copy-btn" onclick="copyText()">
            📋 Copy
        </button>

        <button class="speak-btn" onclick="speakText()">
            🔊 Speak
        </button>

    </div>

    <div class="result">

        <label>Translated Text</label>

        <textarea id="outputText"
            placeholder="Translation will appear here..."
            readonly></textarea>

        <p id="status"></p>

    </div>

</div>


<script>

async function translateText() {

    const text = document.getElementById("inputText").value;
    const source = document.getElementById("source").value;
    const target = document.getElementById("target").value;

    const output = document.getElementById("outputText");
    const status = document.getElementById("status");

    if (!text.trim()) {
        alert("Please enter some text.");
        return;
    }

    status.innerText = "Translating...";

    try {

        const response = await fetch("/translate", {

            method: "POST",

            headers: {
                "Content-Type": "application/json"
            },

            body: JSON.stringify({
                text: text,
                source: source,
                target: target
            })

        });

        const data = await response.json();

        if (data.translation) {

            output.value = data.translation;
            status.innerText = "Translation completed successfully.";

        } else {

            status.innerText = data.error || "Translation failed.";

        }

    } catch (error) {

        status.innerText = "Unable to connect to translation service.";

    }
}


function copyText() {

    const output = document.getElementById("outputText");

    if (!output.value) {
        alert("Nothing to copy.");
        return;
    }

    navigator.clipboard.writeText(output.value);

    alert("Translation copied!");

}


function speakText() {

    const text = document.getElementById("outputText").value;

    if (!text) {
        alert("Nothing to speak.");
        return;
    }

    const speech = new SpeechSynthesisUtterance(text);

    speech.lang = document.getElementById("target").value;

    window.speechSynthesis.speak(speech);

}

</script>

</body>

</html>
